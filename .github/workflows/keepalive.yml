# Render's free plan puts the server to sleep after 15 min without traffic.
# Ping it every 10 minutes so the doctor portal, the app and the Telegram bot answer instantly.
name: Keep server awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            curl -fsS --max-time 90 https://afib-monitor.onrender.com/api/health && exit 0
            sleep 20
          done
          exit 1
