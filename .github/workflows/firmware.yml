name: Firmware
on:
  push:
    paths: ["firmware/**", "hardware/**", "backend/app/ecgtools.py", "backend/app/ectopy.py", "backend/app/pvc_model.json", "tools/pvc_export.py", "tools/parity/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

# Compiles the M5Stack CoreS3 SE firmware exactly as the README tells a person to do in Arduino IDE
# (esp32 core 3.x + M5Unified), so that the day the board arrives only flashing is left.
jobs:
  parity:
    # the 30-second check on the device must give the same verdict as the server on the same strips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Patch schematic rules check, firmware pins = schematic pins, pins = footprint pads
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/KiCad/kicad-footprints.git /tmp/kfp
          git -C /tmp/kfp sparse-checkout set Package_CSP.pretty Package_TO_SOT_SMD.pretty Resistor_SMD.pretty Capacitor_SMD.pretty LED_SMD.pretty Connector_USB.pretty Connector_JST.pretty
          KICAD_FOOTPRINTS=/tmp/kfp python hardware/patch_v1/design.py
      - name: Server verdicts on 40 synthetic strips
        run: PYTHONPATH=backend python tools/parity/make_cases.py /tmp/parity.json /tmp/parity.txt
      - name: Device code on a PC, same strips
        run: g++ -O2 -std=c++17 -I firmware/AFibMonitor tools/parity/check30_host.cpp -o /tmp/c30 && /tmp/c30 < /tmp/parity.txt
      - name: Device PVC header is generated from the committed model
        run: python tools/pvc_export.py backend/app/pvc_model.json /tmp/pvc_model.h && diff -q /tmp/pvc_model.h firmware/AFibMonitor/pvc_model.h
      - name: PVC features and model on the device = server, bit for bit (research estimate)
        run: |
          PYTHONPATH=backend python tools/parity/ectopy_cases.py backend/app/pvc_model.json /tmp/ecto.txt
          g++ -O2 -std=c++17 -I firmware/AFibMonitor tools/parity/ectopy_host.cpp -o /tmp/ecto && /tmp/ecto < /tmp/ecto.txt
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install esp32 core and M5Unified
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install M5Unified
          arduino-cli core list
          arduino-cli board listall | grep -i cores3 || true
      - name: Compile
        run: |
          arduino-cli compile --fqbn esp32:esp32:m5stack_cores3:CDCOnBoot=cdc \
            --output-dir build --warnings default firmware/AFibMonitor 2>&1 | tee compile.log
      - name: Size report
        if: always()
        run: grep -E "Sketch uses|Global variables" compile.log || true
      - name: Compile for our patch (hardware/patch_v1, no screen)
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc \
            --build-property "compiler.cpp.extra_flags=-DBOARD_PATCH_V1" --build-property "compiler.c.extra_flags=-DBOARD_PATCH_V1" \
            --output-dir build_patch --warnings default firmware/AFibMonitor 2>&1 | tee compile_patch.log
          grep -E "Sketch uses|Global variables" compile_patch.log
          ! grep -q "M5Unified" compile_patch.log || { echo "patch build must not use M5Unified"; exit 1; }
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: afib-monitor-firmware
          path: |
            build/*.bin
            build_patch/*.bin
  release:
    # Public download for the day the board arrives: tools/flash_m5.sh takes the newest build from here, no login needed.
    needs: [parity, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: afib-monitor-firmware, path: fw }
      - name: Update the "firmware-latest" pre-release
        env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}", SHA: "${{ github.sha }}" }
        run: |
          ls -R fw
          cp fw/build/AFibMonitor.ino.merged.bin afib-m5-cores3se.bin
          cp fw/build_patch/AFibMonitor.ino.merged.bin afib-patch-v1.bin
          sha256sum afib-m5-cores3se.bin afib-patch-v1.bin > SHA256SUMS
          gh api -X PATCH "repos/$REPO/git/refs/tags/firmware-latest" -f sha="$SHA" -F force=true \
            || gh api -X POST "repos/$REPO/git/refs" -f ref=refs/tags/firmware-latest -f sha="$SHA"
          gh release view firmware-latest -R "$REPO" >/dev/null 2>&1 \
            || gh release create firmware-latest -R "$REPO" --prerelease --title "Firmware (latest build)" --notes "placeholder"
          gh release edit firmware-latest -R "$REPO" --notes "Built automatically from commit $SHA. Flash: tools/flash_m5.sh (see firmware/README.md). Not a medical device."
          gh release upload firmware-latest -R "$REPO" --clobber afib-m5-cores3se.bin afib-patch-v1.bin SHA256SUMS
