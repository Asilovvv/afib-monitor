name: Firmware
on:
  push:
    paths: ["firmware/**", "backend/app/ecgtools.py", "backend/app/ectopy.py", "backend/app/pvc_model.json", "tools/pvc_export.py", "tools/parity/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

# Compiles the M5Stack CoreS3 SE firmware exactly as the README tells a person to do in Arduino IDE
# (esp32 core 3.x + M5Unified), so that the day the board arrives only flashing is left.
jobs:
  parity:
    # the 30-second check on the device must give the same verdict as the server on the same strips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Server verdicts on 40 synthetic strips
        run: PYTHONPATH=backend python tools/parity/make_cases.py /tmp/parity.json /tmp/parity.txt
      - name: Device code on a PC, same strips
        run: g++ -O2 -std=c++17 -I firmware/AFibMonitor tools/parity/check30_host.cpp -o /tmp/c30 && /tmp/c30 < /tmp/parity.txt
      - name: Device PVC header is generated from the committed model
        run: python tools/pvc_export.py backend/app/pvc_model.json /tmp/pvc_model.h && diff -q /tmp/pvc_model.h firmware/AFibMonitor/pvc_model.h
      - name: PVC features and model on the device = server, bit for bit (research estimate)
        run: |
          PYTHONPATH=backend python tools/parity/ectopy_cases.py backend/app/pvc_model.json /tmp/ecto.txt
          g++ -O2 -std=c++17 -I firmware/AFibMonitor tools/parity/ectopy_host.cpp -o /tmp/ecto && /tmp/ecto < /tmp/ecto.txt
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install esp32 core and M5Unified
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install M5Unified
          arduino-cli core list
          arduino-cli board listall | grep -i cores3 || true
      - name: Compile
        run: |
          arduino-cli compile --fqbn esp32:esp32:m5stack_cores3:CDCOnBoot=cdc \
            --output-dir build --warnings default firmware/AFibMonitor 2>&1 | tee compile.log
      - name: Size report
        if: always()
        run: grep -E "Sketch uses|Global variables" compile.log || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: afib-monitor-firmware
          path: build/*.bin
