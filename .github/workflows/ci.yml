name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests

  pilot-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: sudo apt-get install -y -q poppler-utils
      - run: pip install -r backend/requirements.txt numpy scipy matplotlib
      - name: Pilot pipeline on synthetic participants (blinding, refusal without labels, endpoints)
        run: python tools/pilot_selftest.py

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: afib, POSTGRES_DB: afib }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt pytest
      - name: End-to-end over HTTP on PostgreSQL (tools/e2e_local.py), before pytest reuses the database
        env: { DATABASE_URL: "postgresql://postgres:afib@localhost:5432/afib", ADMIN_TOKEN: e2e-admin, JWT_SECRET: ci-e2e-secret-0123456789abcdef-xyz }
        run: |
          python -m uvicorn app.main:app --port 8099 > /tmp/e2e.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8099/api/health >/dev/null && break; sleep 1; done
          python ../tools/e2e_local.py http://localhost:8099 e2e-admin || (cat /tmp/e2e.log; exit 1)
      - run: python -m pytest -q tests
        env: { TEST_DATABASE_URL: "postgresql://postgres:afib@localhost:5432/afib" }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx -y tsx@4.19.2 ../tools/mobile/ecgbus_test.ts
      - run: npx -y tsx@4.19.2 ../tools/mobile/cuffocr_test.ts
      - run: npx -y tsx@4.19.2 ../tools/mobile/snr_test.ts
      - run: npx -y tsx@4.19.2 ../tools/mobile/guard_test.ts
      - run: npx -y tsx@4.19.2 ../tools/mobile/joinlink_test.ts
